name: 'PR stats'

on:
  pull_request:

# Cancel in-progress jobs when a new commit is pushed
concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run:
    name: "Benchmark"
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: true # Fail the entire workflow if any job fails
      matrix:
        operating-system: [ ubuntu-latest ]
        php-versions: [ 8.5 ]
        stability: [prefer-stable]
    services:
      kafka:
        image: apache/kafka:3.9.0
        options: >-
          --env KAFKA_NODE_ID=0
          --env KAFKA_PROCESS_ROLES=broker,controller
          --env KAFKA_CONTROLLER_QUORUM_VOTERS=0@127.0.0.1:9093
          --env KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
          --env KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://:9093
          --env KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092
          --env KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          --env KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
          --env KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
          --env KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
          --env KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
          --env KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
        ports:
          - 9092:9092
      rabbitmq:
        image: rabbitmq:4.1.4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "secret"
          MYSQL_USER: "ecotone"
          MYSQL_PASSWORD: "secret"
          MYSQL_DATABASE: "ecotone"
          DB_PORT: 3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
      postgres:
        image: simplycodedsoftware/postgres:16.1
        env:
          POSTGRES_USER: ecotone
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      localstack:
        image: localstack/localstack:3.0.0
        env:
          SERVICES: 'sqs,sns'
        ports:
          - "4566:4566"
          - "4510-4559:4510-4559"
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
    env:
      RABBIT_HOST: amqp://127.0.0.1:5672
      KAFKA_DSN: 127.0.0.1:9092
      SQS_DSN: sqs:?key=key&secret=secret&region=us-east-1&endpoint=http://127.0.0.1:4566&version=latest
      REDIS_DSN: redis://127.0.0.1:6379
      DATABASE_DSN: pgsql://ecotone:secret@127.0.0.1:5432/ecotone
    steps:
      - name: PHP ${{ matrix.php-versions }} - ${{ matrix.stability }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: rdkafka
          coverage: none

      - uses: actions/checkout@v3
        with:
          ref: main

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --ignore-platform-reqs

      - name: Benchmark main as baseline
        id: baseline
        continue-on-error: true
        run: |
          vendor/bin/phpbench run --retry-threshold=5 --tag=main --report=github-report --profile=opcache_enabled

      - uses: actions/checkout@v3
        with:
          clean: false

      - name: Remove cached files but keep phpbench results
        run: |
          git clean -fxd -e .phpbench -e vendor

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --ignore-platform-reqs

      - name: Benchmark PR
        shell: bash
        env:
          PHPBENCH_REF_OPTION: "${{ steps.baseline.outcome == 'success' && '--ref=main' || '' }}"
        run: |
          echo "Baseline: $PHPBENCH_REF_OPTION"
          vendor/bin/phpbench run --retry-threshold=5 --report=github-report --profile=opcache_enabled $PHPBENCH_REF_OPTION | bin/phpbench-to-md.sh > benchmark.md
          cat benchmark.md
          echo '## Benchmark' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark.md >> "$GITHUB_STEP_SUMMARY"
