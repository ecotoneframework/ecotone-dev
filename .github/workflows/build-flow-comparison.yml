name: Build Flow Comparison

# Compares the message flow of the flow scenario catalogue at the base commit with the merge ref and builds the
# pull request comment. It runs the pull request's code, so it has no write permission; the comment is posted by
# build-flow-comment.yml from the artifact this uploads. Report only: it fails only when the tooling breaks.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: build-flow-comparison-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The "before" of the comparison is the base commit's own message flow, snapshotted here, so the comment is
      # right when main's committed baseline lags behind a merge or the pull request edited it
      - name: Check out the base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: build-flow-base

      - name: Set Up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --ignore-platform-reqs

      - name: Snapshot the message flow of the base commit
        id: before
        shell: bash
        run: |
          if [ -f build-flow-base/bin/build-flow.php ]; then
            (cd build-flow-base && composer update --prefer-dist --no-interaction --ignore-platform-reqs && php bin/build-flow.php snapshot --location="$GITHUB_WORKSPACE/build-flow-before")
            echo 'compared-with=base-commit' >> "$GITHUB_OUTPUT"
          else
            echo 'The base commit has no bin/build-flow.php yet; comparing with the baseline this pull request commits.'
            cp -R packages/Ecotone/tests/BuildFlow/baseline build-flow-before
            echo 'compared-with=committed-baseline' >> "$GITHUB_OUTPUT"
          fi

      - name: Test the comment builder
        run: php bin/test-build-flow-comment.php

      # The build presentation draws the message's path as a sequence diagram first and keeps the marked wiring
      # and traced spans collapsed under it, so the comment always shows a diagram, also when the wiring is unchanged
      - name: Compare the message flow with the base commit
        id: compare
        shell: bash
        run: |
          set +e
          php bin/build-flow.php compare --from=build-flow-before --presentation=build > build-flow-comparison.md 2> build-flow-compare-error.txt
          status=$?
          set -e
          if [ "$status" -ne 0 ] && grep -q 'a comparison across a snapshot format change cannot be drawn' build-flow-compare-error.txt; then
            echo 'format-change=--format-change=build-flow-compare-error.txt' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat build-flow-compare-error.txt >&2
          exit "$status"

      - name: Build the pull request comment
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMPARED_WITH: ${{ steps.before.outputs.compared-with }}
          FORMAT_CHANGE: ${{ steps.compare.outputs.format-change }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: php bin/build-flow-comment.php --comparison=build-flow-comparison.md --pull-request="$PULL_REQUEST" --head-sha="$HEAD_SHA" --base-sha="$BASE_SHA" --compared-with="$COMPARED_WITH" --run-url="$RUN_URL" --output=build-flow-comment.json $FORMAT_CHANGE

      - name: Upload the full comparison
        uses: actions/upload-artifact@v4
        with:
          name: build-flow-comparison
          path: build-flow-comparison.md

      - name: Upload the comment for build-flow-comment.yml
        uses: actions/upload-artifact@v4
        with:
          name: build-flow-comment
          path: build-flow-comment.json
