name: Check Contribution Terms Agreement

on:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - '*.*'

# Cancel in-progress jobs when a new commit is pushed
concurrency:
  group: file-licence-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set Up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --ignore-platform-reqs

      - name: Check for Contribution Files
        shell: bash
        run: |
          php bin/check-licence.php

      - name: Check framework code opens no transaction outside the boundaries
        run: php bin/check-framework-transactions.php

      - name: Check framework code builds no database connection outside the connection pool
        run: php bin/check-framework-connections.php

      - name: Check every flow scenario is in the flow scenario catalogue once
        run: |
          php bin/test-check-flow-catalogue.php
          php bin/check-flow-catalogue.php
