name: Publish Ecotone Pulse image

on:
  workflow_run:
    workflows: ['Releasing latest changes']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Released tag to publish, e.g. 2.0.0-beta.6'
        required: true

concurrency:
  group: pulse-publish-${{ github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE: ecotoneframework/ecotone-pulse

jobs:
  publish:
    name: Build, verify and push the Pulse image
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve the released tag
        id: release
        run: |
          tag="${{ inputs.tag || github.event.workflow_run.head_branch }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - name: Skip releases without Pulse
        id: pulse
        run: |
          if [ -f apps/Pulse/Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release ${{ steps.release.outputs.tag }} has no apps/Pulse, nothing to publish."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the release public key
        if: steps.pulse.outputs.present == 'true'
        run: |
          if [ -z "${{ secrets.ECOTONE_ENTERPRISE_PUBLIC_KEY }}" ]; then
            echo "ECOTONE_ENTERPRISE_PUBLIC_KEY secret is missing"
            exit 1
          fi
          echo "${{ secrets.ECOTONE_ENTERPRISE_PUBLIC_KEY }}" > "$RUNNER_TEMP/ecotone-enterprise-public-key.pem"

      - name: Image tags
        if: steps.pulse.outputs.present == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}

      - uses: docker/setup-buildx-action@v3
        if: steps.pulse.outputs.present == 'true'

      - name: Build the production image
        if: steps.pulse.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/Pulse/Dockerfile
          push: false
          load: true
          no-cache: true
          tags: ecotone-pulse:release
          build-args: |
            PULSE_VERSION=${{ steps.release.outputs.tag }}
          secret-files: |
            ecotone_enterprise_public_key=${{ runner.temp }}/ecotone-enterprise-public-key.pem

      - name: Verify the image refuses Ecotone's testing licence
        if: steps.pulse.outputs.present == 'true'
        run: apps/Pulse/docker/verify-production-licence.sh ecotone-pulse:release "$RUNNER_TEMP/ecotone-enterprise-public-key.pem"

      - name: Log in to Docker Hub
        if: steps.pulse.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the verified image
        if: steps.pulse.outputs.present == 'true'
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker tag ecotone-pulse:release "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
