name: Ecotone Pulse

on:
  pull_request:
    paths:
      - 'apps/Pulse/**'
      - 'packages/**'
      - '.github/workflows/pulse.yml'
  push:
    branches:
      - '**'
    tags-ignore:
      - '*.*'
    paths:
      - 'apps/Pulse/**'
      - 'packages/**'
      - '.github/workflows/pulse.yml'

concurrency:
  group: pulse-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pulse tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      database:
        image: postgres:16
        env:
          POSTGRES_USER: ecotone
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ecotone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecotone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_DSN: pgsql://ecotone:secret@127.0.0.1:5432/ecotone?serverVersion=16
      COMPOSER_ROOT_VERSION: dev-main
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: amqp, rdkafka, redis, pdo_pgsql, sockets, intl
          coverage: none

      - name: Pin the path packages the way the Docker image does
        working-directory: apps/Pulse
        run: php docker/pin-path-package-versions.php

      - name: Install Pulse with fresh path packages
        working-directory: apps/Pulse
        env:
          COMPOSER: composer.pinned.json
        run: composer update --prefer-dist --no-interaction

      - name: Install the offline assets the pages render
        working-directory: apps/Pulse
        env:
          COMPOSER: composer.pinned.json
        run: composer assets:install

      - name: Run Pulse tests
        working-directory: apps/Pulse
        env:
          COMPOSER: composer.pinned.json
          COMPOSER_PROCESS_TIMEOUT: 0
        run: composer tests:ci

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse every page's diagram with Mermaid
        working-directory: apps/Pulse/tests/Mermaid
        run: |
          npm ci --no-audit --no-fund
          node parse.mjs ../../var/mermaid

  docker:
    name: Pulse Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      database:
        image: postgres:16
        env:
          POSTGRES_USER: ecotone
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ecotone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecotone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the Pulse image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/Pulse/Dockerfile
          push: false
          load: true
          tags: ecotone-pulse:ci
          build-args: |
            PULSE_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test, a missing configuration is refused with the expected message
        run: |
          set +e
          output="$(docker run --rm ecotone-pulse:ci 2>&1)"
          status=$?
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep -q "ECOTONE_LICENCE_KEY is not set"

      - name: Smoke test, a consumer that keeps exiting at once backs off and then stops the container
        run: |
          licence="$(docker run --rm --entrypoint php ecotone-pulse:ci -r 'require "vendor/autoload.php"; echo Ecotone\Test\LicenceTesting::VALID_LICENCE;')"
          set +e
          output="$(docker run --rm \
            -e APP_SECRET=ci \
            -e ECOTONE_LICENCE_KEY="$licence" \
            -e PULSE_TRANSPORT_DSN=sqlite:////tmp/transport.db \
            -e PULSE_SERVICES=orders:orders_channel \
            -e PULSE_WORKER_TIME_LIMIT_MS=1 \
            -e PULSE_RESTART_MAX_RAPID=3 \
            ecotone-pulse:ci 2>&1)"
          status=$?
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep -q "Pulse is stopping"

  smoke:
    name: Pulse smoke, ${{ matrix.transport }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - transport: pgsql
            dsn: pgsql://ecotone:secret@database:5432/pulse_smoke
            secret_files: '1'
            stop_consumer: '1'
          - transport: amqp
            dsn: amqp://guest:guest@rabbitmq:5672
          - transport: redis
            dsn: redis://redis:6379
          - transport: sqs
            dsn: sqs:?key=key&secret=secret&region=us-east-1&endpoint=http://localstack:4566&version=latest
          - transport: kafka
            dsn: kafka://kafka:9092
    env:
      COMPOSE_PROJECT_NAME: pulse-smoke
      SMOKE_NETWORK: pulse-smoke_default
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the Pulse image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/Pulse/Dockerfile
          push: false
          load: true
          tags: ecotone-pulse:ci
          build-args: |
            PULSE_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the broker of this transport
        run: |
          case "${{ matrix.transport }}" in
            pgsql) services="database" ;;
            amqp) services="rabbitmq" ;;
            redis) services="redis" ;;
            sqs) services="localstack" ;;
            kafka) services="kafka" ;;
          esac
          docker compose up -d --wait $services
          if [ "${{ matrix.transport }}" = "pgsql" ]; then
            docker compose exec -T database psql -U ecotone -d ecotone -c "CREATE DATABASE pulse_smoke"
          fi

      - name: The image turns healthy, a fixture service reaches Connected and /readyz is ready
        env:
          SMOKE_SECRET_FILES: ${{ matrix.secret_files }}
          SMOKE_STOP_CONSUMER: ${{ matrix.stop_consumer }}
        run: apps/Pulse/docker/smoke.sh "${{ matrix.transport }}" "${{ matrix.dsn }}"

  production-licence:
    name: Pulse production image refuses the testing licence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Generate a throwaway release key pair
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/private.pem"
          openssl pkey -in "$RUNNER_TEMP/private.pem" -pubout -out "$RUNNER_TEMP/public.pem"

      - name: Build the image the way the publish workflow does, with the key as a build secret
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/Pulse/Dockerfile
          push: false
          load: true
          no-cache: true
          tags: ecotone-pulse:production-licence
          secret-files: |
            ecotone_enterprise_public_key=${{ runner.temp }}/public.pem

      - name: The image carries the given key and refuses Ecotone's testing licence
        run: apps/Pulse/docker/verify-production-licence.sh ecotone-pulse:production-licence "$RUNNER_TEMP/public.pem"
