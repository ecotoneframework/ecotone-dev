name: Ecotone Pulse

on:
  pull_request:
    paths:
      - 'apps/Pulse/**'
      - 'packages/**'
      - '.github/workflows/pulse.yml'
  push:
    branches:
      - '**'
    tags-ignore:
      - '*.*'
    paths:
      - 'apps/Pulse/**'
      - 'packages/**'
      - '.github/workflows/pulse.yml'

concurrency:
  group: pulse-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pulse tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      database:
        image: postgres:16
        env:
          POSTGRES_USER: ecotone
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ecotone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecotone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_USER: ecotone
          MYSQL_PASSWORD: secret
          MYSQL_DATABASE: ecotone
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4.1.4-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      kafka:
        image: apache/kafka:3.9.0
        options: >-
          --env KAFKA_NODE_ID=0
          --env KAFKA_PROCESS_ROLES=broker,controller
          --env KAFKA_CONTROLLER_QUORUM_VOTERS=0@127.0.0.1:9093
          --env KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
          --env KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://:9093
          --env KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092
          --env KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          --env KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
          --env KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
          --env KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
          --env KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
          --env KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
        ports:
          - 9092:9092
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_DSN: pgsql://ecotone:secret@127.0.0.1:5432/ecotone?serverVersion=16
      SECONDARY_DATABASE_DSN: mysql://ecotone:secret@127.0.0.1:3306/ecotone?serverVersion=8.0
      RABBIT_HOST: amqp://127.0.0.1:5672
      KAFKA_DSN: 127.0.0.1:9092
      REDIS_DSN: redis://127.0.0.1:6379
      COMPOSER_ROOT_VERSION: dev-main
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: amqp, rdkafka, redis, pdo_pgsql, pdo_mysql, sockets, intl
          coverage: none

      - name: Pin the path packages the way the Docker image does
        working-directory: apps/Pulse
        run: php docker/pin-path-package-versions.php

      - name: Install Pulse with fresh path packages
        working-directory: apps/Pulse
        env:
          COMPOSER: composer.pinned.json
        run: composer update --prefer-dist --no-interaction

      - name: Install the offline assets the pages render
        working-directory: apps/Pulse
        env:
          COMPOSER: composer.pinned.json
        run: composer assets:install

      - name: Run Pulse tests
        working-directory: apps/Pulse
        env:
          COMPOSER: composer.pinned.json
          COMPOSER_PROCESS_TIMEOUT: 0
        run: composer tests:ci

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse every page's diagram with Mermaid
        working-directory: apps/Pulse/tests/Mermaid
        run: |
          npm ci --no-audit --no-fund
          node parse.mjs ../../var/mermaid

  docker:
    name: Pulse Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      database:
        image: postgres:16
        env:
          POSTGRES_USER: ecotone
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ecotone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecotone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the Pulse image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/Pulse/Dockerfile
          push: false
          load: true
          tags: ecotone-pulse:ci
          build-args: |
            PULSE_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test, a missing configuration is refused with the expected message
        run: |
          set +e
          output="$(docker run --rm ecotone-pulse:ci 2>&1)"
          status=$?
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep -q "ECOTONE_LICENCE_KEY is not set"

      - name: Smoke test, a consumer that keeps exiting at once backs off and then stops the container
        run: |
          licence="$(docker run --rm --entrypoint php ecotone-pulse:ci -r 'require "vendor/autoload.php"; echo Ecotone\Test\LicenceTesting::VALID_LICENCE;')"
          set +e
          output="$(docker run --rm \
            -e APP_SECRET=ci \
            -e ECOTONE_LICENCE_KEY="$licence" \
            -e PULSE_TRANSPORT_DSN=sqlite:////tmp/transport.db \
            -e PULSE_SERVICES=orders:orders_channel \
            -e PULSE_WORKER_TIME_LIMIT_MS=1 \
            -e PULSE_RESTART_MAX_RAPID=3 \
            ecotone-pulse:ci 2>&1)"
          status=$?
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep -q "Pulse is stopping"

  smoke:
    name: Pulse smoke, ${{ matrix.transport }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - transport: pgsql
            dsn: pgsql://ecotone:secret@database:5432/pulse_smoke
            secret_files: '1'
            stop_consumer: '1'
          - transport: amqp
            dsn: amqp://guest:guest@rabbitmq:5672
          - transport: redis
            dsn: redis://redis:6379
          - transport: sqs
            dsn: sqs:?key=key&secret=secret&region=us-east-1&endpoint=http://localstack:4566&version=latest
          - transport: kafka
            dsn: kafka://kafka:9092
    env:
      COMPOSE_PROJECT_NAME: pulse-smoke
      SMOKE_NETWORK: pulse-smoke_default
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the Pulse image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/Pulse/Dockerfile
          push: false
          load: true
          tags: ecotone-pulse:ci
          build-args: |
            PULSE_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the broker of this transport
        run: |
          case "${{ matrix.transport }}" in
            pgsql) services="database" ;;
            amqp) services="rabbitmq" ;;
            redis) services="redis" ;;
            sqs) services="localstack" ;;
            kafka) services="kafka" ;;
          esac
          docker compose up -d --wait $services
          if [ "${{ matrix.transport }}" = "pgsql" ]; then
            docker compose exec -T database psql -U ecotone -d ecotone -c "CREATE DATABASE pulse_smoke"
          fi

      - name: The image turns healthy, a fixture service reaches Connected and /readyz is ready
        env:
          SMOKE_SECRET_FILES: ${{ matrix.secret_files }}
          SMOKE_STOP_CONSUMER: ${{ matrix.stop_consumer }}
        run: apps/Pulse/docker/smoke.sh "${{ matrix.transport }}" "${{ matrix.dsn }}"
