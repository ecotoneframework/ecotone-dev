name: Ecotone Pulse

on:
  pull_request:
    paths:
      - 'apps/Pulse/**'
      - 'packages/**'
      - '.github/workflows/pulse.yml'
  push:
    branches:
      - '**'
    tags-ignore:
      - '*.*'
    paths:
      - 'apps/Pulse/**'
      - 'packages/**'
      - '.github/workflows/pulse.yml'

concurrency:
  group: pulse-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pulse tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      database:
        image: postgres:16
        env:
          POSTGRES_USER: ecotone
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ecotone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecotone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_DSN: pgsql://ecotone:secret@127.0.0.1:5432/ecotone?serverVersion=16
      COMPOSER_ROOT_VERSION: dev-main
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: amqp, rdkafka, redis, pdo_pgsql, sockets, intl
          coverage: none

      - name: Pin the path packages the way the Docker image does
        working-directory: apps/Pulse
        run: php docker/pin-path-package-versions.php

      - name: Install Pulse with fresh path packages
        working-directory: apps/Pulse
        env:
          COMPOSER: composer.pinned.json
        run: composer update --prefer-dist --no-interaction

      - name: Install the offline assets the pages render
        working-directory: apps/Pulse
        env:
          COMPOSER: composer.pinned.json
        run: composer assets:install

      - name: Run Pulse tests
        working-directory: apps/Pulse
        env:
          COMPOSER: composer.pinned.json
          COMPOSER_PROCESS_TIMEOUT: 0
        run: composer tests:ci

  docker:
    name: Pulse Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      database:
        image: postgres:16
        env:
          POSTGRES_USER: ecotone
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ecotone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecotone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the Pulse image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/Pulse/Dockerfile
          push: false
          load: true
          tags: ecotone-pulse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test, a missing configuration is refused with the expected message
        run: |
          set +e
          output="$(docker run --rm ecotone-pulse:ci 2>&1)"
          status=$?
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep -q "ECOTONE_LICENCE_KEY is not set"

      - name: Smoke test, one container serves, consumes replies, refreshes and answers a Refresh with Connected
        run: |
          licence="$(docker run --rm --entrypoint php ecotone-pulse:ci -r 'require "vendor/autoload.php"; echo Ecotone\Test\LicenceTesting::VALID_LICENCE;')"
          dsn=pgsql://ecotone:secret@127.0.0.1:5432/ecotone
          docker run -d --name pulse --network host \
            -e APP_SECRET=ci \
            -e ECOTONE_LICENCE_KEY="$licence" \
            -e PULSE_TRANSPORT_DSN="$dsn" \
            -e PULSE_SERVICES=orders:orders_channel \
            ecotone-pulse:ci
          for attempt in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz || true)"
            test "$code" = "200" && break
            sleep 2
          done
          docker logs pulse
          test "$code" = "200"
          docker exec pulse test -f /app/var/internal/pulse.sqlite
          for process in frankenphp "ecotone:run" "pulse:refresh"; do
            docker exec pulse sh -c "grep -l '$process' /proc/[0-9]*/cmdline" > /dev/null
          done
          docker run -d --name orders --network host \
            -e ECOTONE_LICENCE_KEY="$licence" \
            -e PULSE_TRANSPORT_DSN="$dsn" \
            --entrypoint php ecotone-pulse:ci docker/smoke-service.php
          sleep 5
          page="$(curl -s -L -d '' http://127.0.0.1:8080/refresh)"
          echo "$page" | grep -q 'data-status="connected"'
          if docker logs pulse 2>&1 | grep -qi "critical"; then
            docker logs pulse
            exit 1
          fi
