name: Tests

on:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - '*.*'

defaults:
  run:
    shell: bash

concurrency:
  group: split-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: Split Testing
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          - php-version: '8.2'
          - php-version: '8.5'
          - php-version: '8.2'
            stability: prefer-lowest

    services:
      kafka:
        image: apache/kafka:3.9.0
        options: >-
          --env KAFKA_NODE_ID=0
          --env KAFKA_PROCESS_ROLES=broker,controller
          --env KAFKA_CONTROLLER_QUORUM_VOTERS=0@127.0.0.1:9093
          --env KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
          --env KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://:9093
          --env KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092
          --env KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          --env KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
          --env KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
          --env KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
          --env KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
          --env KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
        ports:
          - 9092:9092
      rabbitmq:
        image: rabbitmq:4.1.4-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "secret"
          MYSQL_USER: "ecotone"
          MYSQL_PASSWORD: "secret"
          MYSQL_DATABASE: "ecotone"
          DB_PORT: 3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=5
        ports:
          - 3306:3306
      postgres:
        image: simplycodedsoftware/postgres:16.1
        env:
          POSTGRES_USER: ecotone
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      localstack:
        image: localstack/localstack:3.8
        env:
          SERVICES: 'sqs,sns'
          SQS_DISABLE_CLOUDWATCH_METRICS: '1'
          EAGER_SERVICE_LOADING: '1'
        ports:
          - "4566:4566"
          - "4510-4559:4510-4559"
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'

    env:
      RABBIT_HOST: amqp://127.0.0.1:5672
      SQS_DSN: sqs:?key=key&secret=secret&region=us-east-1&endpoint=http://127.0.0.1:4566&version=latest
      REDIS_DSN: redis://127.0.0.1:6379
      KAFKA_DSN: 127.0.0.1:9092
      COMPOSER_ROOT_VERSION: 'dev-main'
      COMPOSER_PROCESS_TIMEOUT: 3600

    steps:
      - uses: actions/checkout@v5

      - name: Set Up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: amqp, rdkafka
          coverage: none

      - name: Install OpenSSH (For Kafka)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-client

      - name: Install DB clients
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client mysql-client

      - name: Wait for Kafka to be ready
        run: |
          echo "Waiting for Kafka to start..."
          for i in {1..30}; do
            if timeout 5 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9092' 2>/dev/null; then
              echo "Kafka is ready!"
              exit 0
            fi
            echo "Attempt $i: Kafka not ready yet, waiting 2 seconds..."
            sleep 2
          done
          echo "Kafka failed to start within 60 seconds"
          exit 1

      - name: Remove grpc dependent packages (no runner installs ext-grpc)
        run: cd packages/OpenTelemetry && composer remove --dev --no-update open-telemetry/transport-grpc

      - name: Run tests
        run: |
          COMPONENTS=$(find packages -maxdepth 2 -type f -name phpunit.xml.dist | xargs -I{} dirname {})
          # ecotone/tempest needs PHP 8.5+ (tempest/framework) and its integration tests use a
          # kernel-boot harness tied to the monorepo layout; it is covered by the unified Monorepo
          # job, so exclude it from the isolated per-package Split Testing matrix.
          COMPONENTS=$(echo "$COMPONENTS" | grep -v 'packages/Tempest')
          # These components run PHPStan once and each database pass as a task of its own, in parallel.
          # A pass owns its databases, its SQLite files and its temp directory, so passes share nothing,
          # and the component takes as long as its slowest pass instead of the sum of all three.
          SPLIT_DATABASE_PASSES="packages/Dbal packages/PdoEventSourcing"

          if [ "${{ matrix.stability }}" = "prefer-lowest" ]; then
            COMPOSER_UP="composer update --${{ matrix.stability }}"
          else
            COMPOSER_UP="composer update"
          fi

          _run_tests() {
            local ok=0
            local title="$1"
            local start=$(date -u +%s)

            OUTPUT=$(bash -xc "$2" 2>&1) || ok=$?
            local end=$(date -u +%s)

            if [[ $ok -ne 0 ]]; then
              printf "\n%-70s%10s\n" "$title" $(($end-$start))s
              echo "$OUTPUT"
              echo "Job exited with: $ok"
              echo -e "\n::error::KO $title\n"
            else
              printf "::group::%-68s%10s\n" "$title" $(($end-$start))s
              echo "$OUTPUT"
              echo -e "\n\e[32mOK\e[0m $title\n\n::endgroup::"
            fi

            return $ok
          }

          _install_component() {
            local dir="$1"
            local compose_up_cmd="$2"

            _run_tests "Install composer dependencies ($dir)" "cd '${dir}' && ${compose_up_cmd}"
          }

          _run_pass() {
            local db_host="127.0.0.1"
            local dir="$1"
            local pass="$2"
            local script="$3"
            local slug=$(echo "$dir" | tr '/.-' '___' | tr '[:upper:]' '[:lower:]')
            local pass_slug=$(echo "$pass" | tr '[:upper:]' '[:lower:]')

            # Isolate temp directory per task, so parallel PHPStan runs and parallel database passes
            # do not race on a shared /tmp/phpstan cache or on EcotoneLite cache directories
            local component_tmp_dir="/tmp/ecotone_component_${slug}_${pass_slug}"
            mkdir -p "$component_tmp_dir"
            local run_tests_cmd="TMPDIR='${component_tmp_dir}' composer ${script}"

            # Derive unique DB names per pass to avoid cross-test conflicts
            local db_name="ecotone_${slug}_${pass_slug}"
            local create_databases="\
              psql 'postgresql://ecotone:secret@${db_host}:5432/postgres' -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ${db_name} OWNER ecotone' && \
              mysql -h '${db_host}' -uroot -psecret -e \"CREATE DATABASE ${db_name}; GRANT ALL PRIVILEGES ON ${db_name}.* TO 'ecotone'@'%'; FLUSH PRIVILEGES;\""

            case "$pass" in
              Postgres)
                _run_tests "$dir (Postgres)" "\
                  ${create_databases} && \
                  cd '${dir}' && \
                  DATABASE_DSN='pgsql://ecotone:secret@${db_host}:5432/${db_name}?serverVersion=16' \
                  SECONDARY_DATABASE_DSN='mysql://ecotone:secret@${db_host}:3306/${db_name}?serverVersion=8' \
                  ${run_tests_cmd}"
                ;;
              MySQL)
                _run_tests "$dir (MySQL)" "\
                  ${create_databases} && \
                  cd '${dir}' && \
                  DATABASE_DSN='mysql://ecotone:secret@${db_host}:3306/${db_name}?serverVersion=8' \
                  SECONDARY_DATABASE_DSN='pgsql://ecotone:secret@${db_host}:5432/${db_name}?serverVersion=16' \
                  ${run_tests_cmd}"
                ;;
              SQLite)
                local sqlite_db="/tmp/ecotone_${slug}_test.db"
                local sqlite_db_secondary="/tmp/ecotone_${slug}_test_b.db"
                # Use 4 slashes for absolute paths: sqlite:// + / + /path = sqlite:////path
                # This is needed because both enqueue/dsn and Doctrine's DsnParser
                # require 4 slashes for absolute paths to be parsed correctly
                _run_tests "$dir (SQLite)" "\
                  rm -f '${sqlite_db}' '${sqlite_db_secondary}' && \
                  cd '${dir}' && \
                  DATABASE_DSN='sqlite:///${sqlite_db}' \
                  SECONDARY_DATABASE_DSN='sqlite:///${sqlite_db_secondary}' \
                  ${run_tests_cmd}"
                ;;
              PHPStan)
                _run_tests "$dir (PHPStan)" "cd '${dir}' && ${run_tests_cmd}"
                ;;
              AllDatabases)
                local overall_exit_code=0
                _run_pass "$dir" Postgres "$script" || overall_exit_code=1
                _run_pass "$dir" MySQL "$script" || overall_exit_code=1
                # Run SQLite pass. Only Tempest is skipped: its multi-tenant tests derive a connection
                # from Tempest's own Postgres config and ignore DATABASE_DSN, so they need a server engine.
                # PdoEventSourcing and DataProtection used to be skipped here as "SQLite event store not
                # supported". That is stale - SQLite is a supported event store engine in 2.0
                # (upgrade-2.0.md) and both suites pass against it.
                if [[ ! "$dir" =~ (Tempest) ]]; then
                  _run_pass "$dir" SQLite "$script" || overall_exit_code=1
                fi
                return $overall_exit_code
                ;;
              NoDatabase)
                # No DB dependency: run tests with no DB env vars
                _run_tests "$dir" "cd '${dir}' && ${run_tests_cmd}"
                ;;
            esac
          }
          export -f _run_tests _install_component _run_pass

          install_exit_code=0
          echo "$COMPONENTS" | xargs -n1 | parallel -j +3 "_install_component {} '$COMPOSER_UP'" || install_exit_code=1

          # Determine if database passes are needed (direct or transitive doctrine/dbal).
          # Split passes are listed first, so the longest tasks start first.
          SPLIT_TASKS=""
          OTHER_TASKS=""
          for dir in $COMPONENTS; do
            if ! (cd "$dir" && composer show doctrine/dbal > /dev/null 2>&1); then
              OTHER_TASKS+="$dir NoDatabase tests:ci"$'\n'
            elif [[ " $SPLIT_DATABASE_PASSES " == *" $dir "* ]]; then
              SPLIT_TASKS+="$dir Postgres tests:phpunit"$'\n'"$dir MySQL tests:phpunit"$'\n'"$dir SQLite tests:phpunit"$'\n'"$dir PHPStan tests:phpstan"$'\n'
            else
              OTHER_TASKS+="$dir AllDatabases tests:ci"$'\n'
            fi
          done

          # Run tests in parallel and collect exit codes
          tests_exit_code=0
          printf '%s%s' "$SPLIT_TASKS" "$OTHER_TASKS" | parallel -j +3 --colsep ' ' "_run_pass {1} {2} {3}" || tests_exit_code=1

          exit $(( install_exit_code || tests_exit_code ))
