name: 'Tests'

on:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - '*.*'

# Cancel in-progress jobs when a new commit is pushed
concurrency:
  group: monorepo-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  shards:
    name: "Shards"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
    - uses: actions/checkout@v5

    - name: Check every test suite of phpunit.xml.dist belongs to exactly one shard
      id: shards
      run: |
        matrix=$(php bin/check-monorepo-shards.php)
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  run:
    name: "Monorepo (${{ matrix.shard.name }})"
    needs: shards
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: true # Fail the entire workflow if any job fails
      matrix:
        operating-system: [ ubuntu-latest ]
        php-versions: [ '8.5' ]
        stability: [prefer-stable]
        # The root suite runs in one process, so .github/monorepo-shards.json splits it into shards of about the
        # same measured duration to keep each job under fifteen minutes.
        shard: ${{ fromJSON(needs.shards.outputs.matrix) }}
    services:
      kafka:
        image: apache/kafka:3.9.0
        options: >-
          --env KAFKA_NODE_ID=0
          --env KAFKA_PROCESS_ROLES=broker,controller
          --env KAFKA_CONTROLLER_QUORUM_VOTERS=0@127.0.0.1:9093
          --env KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
          --env KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://:9093
          --env KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092
          --env KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          --env KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
          --env KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
          --env KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
          --env KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
          --env KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
        ports:
          - 9092:9092
      rabbitmq:
        image: rabbitmq:3.11-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "secret"
          MYSQL_USER: "ecotone"
          MYSQL_PASSWORD: "secret"
          MYSQL_DATABASE: "ecotone"
          DB_PORT: 3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
      postgres:
        image: simplycodedsoftware/postgres:16.1
        env:
          POSTGRES_USER: ecotone
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      localstack:
        image: localstack/localstack:3.8
        env:
          SERVICES: 'sqs,sns'
          SQS_DISABLE_CLOUDWATCH_METRICS: '1'
          EAGER_SERVICE_LOADING: '1'
        ports:
          - "4566:4566"
          - "4510-4559:4510-4559"
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
    env:
      RABBIT_HOST: amqp://127.0.0.1:5672
      SQS_DSN: sqs:?key=key&secret=secret&region=us-east-1&endpoint=http://127.0.0.1:4566&version=latest
      REDIS_DSN: redis://127.0.0.1:6379
      KAFKA_DSN: 127.0.0.1:9092
      COMPOSER_PROCESS_TIMEOUT: 3600
    steps:
    - name: PHP ${{ matrix.php-versions }} - ${{ matrix.stability }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: amqp, rdkafka
        coverage: none

    - name: Install OpenSSH (For Kafka)
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-client

    - uses: actions/checkout@v2

    - name: Check the root and per-package test suites run under the same configuration
      run: php bin/check-suite-parity.php

    - name: Skip disk syncs on the test databases
      run: |
        # Test data is thrown away with the job, so waiting for each write to reach the disk only
        # slows down the table drops and creates every database test runs. TCP is used so the
        # settings land on the final server, not on the socket-only server of the image's init phase.
        for i in {1..30}; do
          if docker exec ${{ job.services.mysql.id }} mysql -h127.0.0.1 -uroot -psecret -e "SET GLOBAL innodb_flush_log_at_trx_commit=0; SET GLOBAL sync_binlog=0;" \
            && docker exec -e PGPASSWORD=secret ${{ job.services.postgres.id }} psql -h 127.0.0.1 -U ecotone -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET fsync=off" -c "ALTER SYSTEM SET synchronous_commit=off" -c "ALTER SYSTEM SET full_page_writes=off" -c "SELECT pg_reload_conf()"; then
            exit 0
          fi
          sleep 2
        done
        exit 1

    - name: Wait for Kafka to be ready
      run: |
        echo "Waiting for Kafka to start..."
        for i in {1..30}; do
          if timeout 5 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9092' 2>/dev/null; then
            echo "Kafka is ready!"
            exit 0
          fi
          echo "Attempt $i: Kafka not ready yet, waiting 2 seconds..."
          sleep 2
        done
        echo "Kafka failed to start within 60 seconds"
        exit 1

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Remove grpc dependent packages (no runner installs ext-grpc)
      run: composer remove --dev --no-update open-telemetry/transport-grpc

    - name: Install dependencies
      run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

    - name: Test PHPStan
      run: vendor/bin/phpstan

    - name: Create random file for encryption tests
      run: (cd packages/DataProtection && tests/before-tests.sh)

    - name: Test PHPUnit on Postgres
      run: vendor/bin/phpunit --no-coverage --testsuite "${{ matrix.shard.suites }}"
      env:
        DATABASE_DSN: pgsql://ecotone:secret@127.0.0.1:5432/ecotone?serverVersion=16
        SECONDARY_DATABASE_DSN: mysql://ecotone:secret@127.0.0.1:3306/ecotone?serverVersion=8.0
  coroutines:
    name: "Monorepo (${{ matrix.runtime.name }} coroutines)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - name: OpenSwoole
            extension: openswoole
            tests-of-the-other-runtime: swoole
          - name: Swoole
            extension: swoole
            tests-of-the-other-runtime: openswoole
    services:
      rabbitmq:
        image: rabbitmq:3.11-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "secret"
          MYSQL_USER: "ecotone"
          MYSQL_PASSWORD: "secret"
          MYSQL_DATABASE: "ecotone"
          DB_PORT: 3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
      postgres:
        image: simplycodedsoftware/postgres:16.1
        env:
          POSTGRES_USER: ecotone
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      RABBIT_HOST: amqp://127.0.0.1:5672
      COMPOSER_PROCESS_TIMEOUT: 3600
      # The tests that run messages in real coroutines are skipped wherever neither extension is loaded,
      # so they are named here: a renamed or moved file fails the job instead of silently not running.
      COROUTINE_TESTS: >-
        packages/Ecotone/tests/Messaging/Execution/CoroutineExecutionsTest.php
        packages/Ecotone/tests/Messaging/Execution/ConsumerCoroutinesTest.php
        packages/Ecotone/tests/Messaging/Execution/CoroutineTestingTest.php
        packages/Ecotone/tests/Messaging/Execution/CoroutineMessageChannelTest.php
        packages/Ecotone/tests/Tracing/CoroutineExecutionRecordingTest.php
        packages/Ecotone/tests/Tracing/TracingFlowConformanceTest.php
        packages/OpenTelemetry/tests/Integration/OpenTelemetryFlowConformanceTest.php
        packages/Dbal/tests/Integration/CoroutineExecutionsTest.php
        packages/Dbal/tests/Integration/CoroutineExecutionRecordingTest.php
        packages/Dbal/tests/Integration/CoroutineMessageChannelTest.php
        packages/Symfony/tests/phpunit/CoroutineConnectionPoolTest.php
        packages/Amqp/tests/Integration/CoroutineExecutionsTest.php
    steps:
    - name: PHP 8.5 with OpenSwoole
      if: matrix.runtime.extension == 'openswoole'
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: amqp, rdkafka, openswoole
        coverage: none

    - name: PHP 8.5 without a coroutine extension, Swoole is compiled below
      if: matrix.runtime.extension == 'swoole'
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: amqp, rdkafka, sockets, pdo_pgsql, pdo_mysql, mysqlnd, curl
        coverage: none

    # Swoole is compiled with --enable-swoole-pgsql and --enable-swoole-sqlite, which a packaged build may leave out:
    # they are what lets a coroutine wait on a PostgreSQL or SQLite query, and the Swoole tests prove exactly that.
    # The source comes from PECL, retried, and from the same release tag on GitHub when PECL keeps failing: one
    # HTTP 500 from pecl.php.net failed this job before any test ran.
    - name: Compile Swoole with PostgreSQL and SQLite coroutine support
      if: matrix.runtime.extension == 'swoole'
      env:
        SWOOLE_VERSION: 6.2.6
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libpq-dev libsqlite3-dev libssl-dev libbrotli-dev libc-ares-dev libcurl4-openssl-dev
        download_swoole() { curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/swoole.tgz" "$1"; }
        download_swoole "https://pecl.php.net/get/swoole-${SWOOLE_VERSION}.tgz" \
          || download_swoole "https://github.com/swoole/swoole-src/archive/refs/tags/v${SWOOLE_VERSION}.tar.gz"
        mkdir "$RUNNER_TEMP/swoole"
        tar xzf "$RUNNER_TEMP/swoole.tgz" -C "$RUNNER_TEMP/swoole" --strip-components=1
        cd "$RUNNER_TEMP/swoole"
        phpize
        ./configure --enable-sockets --enable-openssl --enable-mysqlnd --enable-swoole-curl --enable-cares --enable-brotli --enable-swoole-pgsql --enable-swoole-sqlite
        make -j"$(nproc)"
        sudo make install
        echo "extension=swoole" | sudo tee "$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/99-swoole.ini"

    - uses: actions/checkout@v5

    - name: Check ${{ matrix.runtime.name }} is loaded
      run: php --ri ${{ matrix.runtime.extension }}

    - name: Check Swoole waits on PostgreSQL and SQLite in coroutines
      if: matrix.runtime.extension == 'swoole'
      run: |
        php -r 'exit(defined("SWOOLE_HOOK_PDO_PGSQL") && (SWOOLE_HOOK_ALL & SWOOLE_HOOK_PDO_PGSQL) !== 0 ? 0 : 1);'
        php -r 'exit(defined("SWOOLE_HOOK_PDO_SQLITE") && (SWOOLE_HOOK_ALL & SWOOLE_HOOK_PDO_SQLITE) !== 0 ? 0 : 1);'

    - name: Remove grpc dependent packages (no runner installs ext-grpc)
      run: composer remove --dev --no-update open-telemetry/transport-grpc

    - name: Install dependencies
      run: composer update --prefer-stable --prefer-dist --no-interaction

    - name: Coroutine tests with ext-amqp
      run: vendor/bin/phpunit --no-coverage --fail-on-skipped --exclude-group ${{ matrix.runtime.tests-of-the-other-runtime }} $COROUTINE_TESTS
      env:
        DATABASE_DSN: pgsql://ecotone:secret@127.0.0.1:5432/ecotone?serverVersion=16
        SECONDARY_DATABASE_DSN: mysql://ecotone:secret@127.0.0.1:3306/ecotone?serverVersion=8.0

    # OpenSwoole does not let a coroutine wait on a PostgreSQL query, so the stored flow of the catalogue's
    # coroutine scenarios is proven on Swoole
    - name: Flow tracking stores the catalogue's flows, the ones that need a coroutine runtime included
      if: matrix.runtime.extension == 'swoole'
      run: vendor/bin/phpunit --no-coverage --fail-on-skipped packages/Dbal/tests/Conformance/FlowTrackingScenarioConformanceTest.php
      env:
        DATABASE_DSN: pgsql://ecotone:secret@127.0.0.1:5432/ecotone?serverVersion=16
        SECONDARY_DATABASE_DSN: mysql://ecotone:secret@127.0.0.1:3306/ecotone?serverVersion=8.0

    - name: OpenTelemetry tracing on coroutines with open-telemetry/context-swoole
      run: |
        composer show open-telemetry/context-swoole
        vendor/bin/phpunit --no-coverage --fail-on-skipped packages/OpenTelemetry/tests/Integration/CoroutineTracingTest.php

    - name: Coroutine tests with php-amqplib
      run: vendor/bin/phpunit --no-coverage --fail-on-skipped --exclude-group ${{ matrix.runtime.tests-of-the-other-runtime }} $COROUTINE_TESTS
      env:
        AMQP_IMPLEMENTATION: lib
        DATABASE_DSN: mysql://ecotone:secret@127.0.0.1:3306/ecotone?serverVersion=8.0
        SECONDARY_DATABASE_DSN: pgsql://ecotone:secret@127.0.0.1:5432/ecotone?serverVersion=16
