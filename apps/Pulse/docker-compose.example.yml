# Run from the repository root:
#   docker compose -f apps/Pulse/docker-compose.example.yml up --build
# Replace ECOTONE_LICENCE_KEY with your Enterprise licence key before starting.
# Pulse keeps its own state in an SQLite database inside the container, without a volume:
# it is created when the container starts and is gone when the container is replaced.

services:
  pulse:
    build:
      context: ../..
      dockerfile: apps/Pulse/Dockerfile
    environment:
      ECOTONE_LICENCE_KEY: ${ECOTONE_LICENCE_KEY:?set ECOTONE_LICENCE_KEY to your Ecotone Enterprise licence key}
      PULSE_TRANSPORT_DSN: amqp://guest:guest@rabbitmq:5672
      PULSE_SERVICES: orders,billing
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/healthz') === 'ok' ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
