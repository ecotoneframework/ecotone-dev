# Run from the repository root:
#
#   ECOTONE_LICENCE_KEY=... docker compose -f apps/Pulse/docker-compose.example.yml --profile amqp up --build
#       Pulse and RabbitMQ only, for your own services (PULSE_SERVICES=orders,billing).
#
# To see Pulse with services that already run, start the Ecotone demo instead: demo/README.md.
#
# Your own services need your Ecotone Enterprise licence key (trial: https://ecotone.tech/pricing).
# Without ECOTONE_LICENCE_KEY the amqp profile's containers stop at start with a message that names it; `down` and `ps` work without it.
# Pulse keeps its own state in an SQLite database inside the container, without a volume:
# it is created when the container starts and is gone when the container is replaced.

x-pulse-build: &pulse-build
  context: ../..
  dockerfile: apps/Pulse/Dockerfile

x-pulse: &pulse
  image: ecotone-pulse:compose
  environment: &pulse-environment
    ECOTONE_LICENCE_KEY: ${ECOTONE_LICENCE_KEY:-}

x-pulse-healthcheck: &pulse-healthcheck
  test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/healthz') === 'ok' ? 0 : 1);"]
  interval: 5s
  timeout: 5s
  start_period: 20s
  retries: 3

services:
  pulse:
    <<: *pulse
    build: *pulse-build
    profiles: ["amqp"]
    environment:
      <<: *pulse-environment
      PULSE_TRANSPORT_DSN: amqp://guest:guest@rabbitmq:5672
      PULSE_SERVICES: orders,billing
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck: *pulse-healthcheck
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    profiles: ["amqp"]
    image: rabbitmq:4-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
