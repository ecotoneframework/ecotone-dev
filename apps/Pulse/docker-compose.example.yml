# Run from the repository root:
#   docker compose -f apps/Pulse/docker-compose.example.yml up --build
# Replace ECOTONE_LICENCE_KEY with your Enterprise licence key before starting.

x-pulse: &pulse
  build:
    context: ../..
    dockerfile: apps/Pulse/Dockerfile
  environment: &pulse-environment
    APP_SECRET: change-me
    ECOTONE_LICENCE_KEY: ${ECOTONE_LICENCE_KEY:?set ECOTONE_LICENCE_KEY to your Ecotone Enterprise licence key}
    PULSE_SERVICE_NAME: ecotone_pulse
    PULSE_CHANNEL: ecotone_pulse
    PULSE_TRANSPORT_DSN: amqp://guest:guest@rabbitmq:5672
    PULSE_SERVICES: orders:orders_channel,billing:billing_channel
    PULSE_REPLY_TIMEOUT: "10"
    PULSE_RENDER_WAIT: "2"
    PULSE_REFRESH_INTERVAL: "20"
    PULSE_CACHE_DIR: /app/var/pulse-cache
  volumes:
    - pulse-cache:/app/var/pulse-cache
  depends_on:
    rabbitmq:
      condition: service_healthy

services:
  web:
    <<: *pulse
    command: ["web"]
    ports:
      - "8080:8080"

  worker:
    <<: *pulse
    command: ["worker"]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pulse-cache:
