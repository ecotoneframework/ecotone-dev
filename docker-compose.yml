services:
  app:
    image: ecotone/php:8.5.3-dev
    build:
      context: .docker/php
      args:
        BASE_IMAGE: simplycodedsoftware/php:8.5.3
        INSTALL_SOCKETS: 1
    volumes:
      - "$PWD:/data/app"
    working_dir: "/data/app"
    command: sleep 99999
    user: "${USER_PID:-1000}:${USER_PID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 172.17.0.1
    environment:
      COMPOSE_HTTP_TIMEOUT: 9999
      COMPOSER_ROOT_VERSION: 'dev-main'
      XDEBUG_ENABLED: "0"
      PHP_IDE_CONFIG: "serverName=ecotone"
      RABBIT_HOST: "amqp://rabbitmq:5672"
      DATABASE_DSN: pgsql://ecotone:secret@database:5432/ecotone?serverVersion=16
      SQLITE_DATABASE_DSN: sqlite:////tmp/ecotone_test.db
      SECONDARY_DATABASE_DSN: mysql://ecotone:secret@database-mysql:3306/ecotone?serverVersion=8.0
      DATABASE_MYSQL: mysql://ecotone:secret@database-mysql:3306/ecotone?serverVersion=8.0
      DATABASE_MARIADB: mysql://ecotone:secret@database-mariadb:3306/ecotone?serverVersion=11.4.5-MariaDB
      SQS_DSN: sqs:?key=key&secret=secret&region=us-east-1&endpoint=http://localstack:4566&version=latest
      REDIS_DSN: redis://redis:6379
      KAFKA_DSN: kafka:9092
    env_file:
      - path: ".env"
        required: false
    depends_on:
      database:
        condition: service_healthy
      database-mysql:
        condition: service_healthy
      database-mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
  app8_2:
    image: ecotone/php:8.2.31-dev
    build:
      context: .docker/php
      args:
        BASE_IMAGE: simplycodedsoftware/php:8.2.31
    volumes:
      - "$PWD:/data/app"
    working_dir: "/data/app"
    command: sleep 99999
    user: "${USER_PID:-1000}:${USER_PID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 172.17.0.1
    environment:
      COMPOSE_HTTP_TIMEOUT: 9999
      COMPOSER_ROOT_VERSION: 'dev-main'
      XDEBUG_ENABLED: "0"
      PHP_IDE_CONFIG: "serverName=ecotone"
      RABBIT_HOST: "amqp://rabbitmq:5672"
      DATABASE_DSN: mysql://ecotone:secret@database-mysql:3306/ecotone?serverVersion=8.0
      SQLITE_DATABASE_DSN: sqlite:////tmp/ecotone_test.db
      SECONDARY_DATABASE_DSN: pgsql://ecotone:secret@database:5432/ecotone?serverVersion=16
      DATABASE_MYSQL: mysql://ecotone:secret@database-mysql:3306/ecotone?serverVersion=8.0
      DATABASE_MARIADB: mysql://ecotone:secret@database-mariadb:3306/ecotone?serverVersion=11.4.5-MariaDB
      SQS_DSN: sqs:?key=key&secret=secret&region=us-east-1&endpoint=http://localstack:4566&version=latest
      REDIS_DSN: redis://redis:6379
      KAFKA_DSN: kafka:9092
    env_file:
      - path: ".env"
        required: false
    depends_on:
      database:
        condition: service_healthy
      database-mysql:
        condition: service_healthy
      database-mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
  database:
    image: simplycodedsoftware/postgres:16.1
    environment:
      POSTGRES_USER: "ecotone"
      POSTGRES_PASSWORD: "secret"
    ports:
      - "${POSTGRES_PORT:-0}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecotone"]
      interval: 2s
      timeout: 3s
      retries: 30
  database-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "secret"
      MYSQL_USER: "ecotone"
      MYSQL_PASSWORD: "secret"
      MYSQL_DATABASE: "ecotone"
    ports:
      - "${MYSQL_PORT:-0}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uecotone -psecret --silent"]
      interval: 2s
      timeout: 3s
      retries: 30
  database-mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: "secret"
      MARIADB_USER: "ecotone"
      MARIADB_PASSWORD: "secret"
      MARIADB_DATABASE: "ecotone"
    ports:
      - "${MARIADB_PORT:-0}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    build: ./.docker/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '${RABBITMQ_PORT:-0}:5672'
      - '${RABBITMQ_MGMT_PORT:-0}:15672'
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
  localstack:
    image: localstack/localstack:3.8
    environment:
      LOCALSTACK_HOST: 'localstack'
      SERVICES: 'sqs,sns'
      SQS_DISABLE_CLOUDWATCH_METRICS: '1'
      EAGER_SERVICE_LOADING: '1'
    ports:
      - "${LOCALSTACK_PORT:-0}:4566"            # LocalStack Gateway
#      - "4510-4559:4510-4559"  # external services port range
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-0}:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  collector:
    image: otel/opentelemetry-collector-contrib:0.73.0
    networks:
      - default
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - "$PWD/.docker/collector/otel-collector-config.yaml:/etc/otel-collector-config.yml"
    ports:
      - "9411"   # Zipkin receiver
#      - "4317:4317"        # OTLP gRPC receiver
#      - "4318:4318" # OTLP/HTTP receiver
  zipkin:
    image: openzipkin/zipkin-slim
    networks:
      - default
    ports:
      - '${ZIPKIN_PORT:-0}:9411'
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - default
    ports:
      - '${JAEGER_PORT:-0}:16686'
  kafka:
    image: 'apache/kafka:3.9.0'
    ports:
      - '${KAFKA_PORT:-0}:9092'
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40
  kafdrop:
    image: 'obsidiandynamics/kafdrop:latest'
    ports:
      - '${KAFDROP_PORT:-0}:9000'
    environment:
      - KAFKA_BROKERCONNECT=kafka:9092
    networks:
      - default
